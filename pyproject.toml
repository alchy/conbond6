[project]
name = "conbond6"
version = "0.1.0.dev0"
description = "conbond6 — konverzační systém s grafovou pamětí a logickým hodnocením výroků"
requires-python = ">=3.11"
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8"]
# SpacyOracle (cb6/oracle.py) — NN parser, ne LLM; záchrana pro prostředí
# bez UDPipe (viz mereni/HYPOTEZY.md 2026-09-27). Volitelné: čtení jádra
# na tomhle nezávisí, jen nová záchranná cesta orákula.
spacy-cs = ["cs_core_news_sm"]

[tool.setuptools]
packages = ["cb6", "cb6.lang", "bench"]

[tool.setuptools.package-data]
cb6 = ["lexikon/*.jsonl"]
"cb6.lang" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["cb6"]
ignore_missing_imports = true
